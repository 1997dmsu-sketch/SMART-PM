<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1660" viewBox="0 0 1920 1660" role="img" aria-labelledby="title desc">
<title id="title">102门禁低压接线图：条件性NC断电释放方案</title>
<desc id="desc">实线表示电源及人脸机供电。虚线为尚待核实的锁供电和干接点控制；不是施工验收图。电源NC接锁红，GND-A接锁黑；人脸机LOCK NO接电源PUSH，LOCK COM接GND-B。所有虚线仅在锁、电源、参考地及容量条件全部确认后采用。</desc>
<rect width="1920" height="1660" fill="#f3f6fa"/>
<text x="60" y="34" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="46" font-weight="700" fill="#17263e">102 门禁低压接线图</text>
<text x="62" y="103" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#17263e">12V 直流 · 人脸机 LOCK 控制电源 · NC 断电释放候选方案</text>
<rect x="1460" y="38" width="400" height="55" rx="12" fill="#fff1d6" stroke="#e6a13b" stroke-width="2"/>
<text x="1490" y="48" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#97540a">条件版 · 现场待核</text>
<rect x="60" y="156" width="1800" height="194" rx="16" fill="#fff5e8" stroke="#e6a13b" stroke-width="2"/>
<text x="85" y="174" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="700" fill="#8b4500">未核实的候选方案，不可直接用于施工</text>
<text x="85" y="221" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#784817">须先确认：锁断电释放，并允许主电源通断控制及未用线悬空；NC 为常闭 12V 锁输出；</text>
<text x="85" y="260" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#784817">PUSH 对指定 GND 短接触发；两个 GND 共地、回路正确；供电容量及 NC 输出承载满足启动电流。</text>
<text x="85" y="301" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#9a3412">未确认前：不接通虚线，不试短接 PUSH / GND，不连接橙色 Open。</text>
<rect x="60" y="404" width="390" height="810" rx="16" fill="#ffffff" stroke="#c6d2e0" stroke-width="2"/>
<text x="86" y="426" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#17263e">门禁电源（低压端）</text>
<text x="86" y="470" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#64748b">按功能重排，并非端子物理顺序</text>
<rect x="1260" y="404" width="600" height="415" rx="16" fill="#ffffff" stroke="#c6d2e0" stroke-width="2"/>
<text x="1284" y="426" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#17263e">海康人脸机 DS-K1T671BM</text>
<rect x="1260" y="877" width="600" height="337" rx="16" fill="#ffffff" stroke="#c6d2e0" stroke-width="2"/>
<text x="1284" y="899" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#17263e">照片中的五线 12V 电锁</text>
<polyline points="450,535 890,535 890,520 1260,520" fill="none" stroke="#d73d4d" stroke-width="5" stroke-linejoin="round"/>
<polyline points="450,615 930,615 930,590 1260,590" fill="none" stroke="#334155" stroke-width="5" stroke-linejoin="round"/>
<polyline points="450,615 790,615 790,655 1110,655 1110,671 1260,671" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-dasharray="13 10"/>
<polyline points="450,740 1260,740" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-dasharray="13 10"/>
<polyline points="450,901 935,901 935,970 1260,970" fill="none" stroke="#d73d4d" stroke-width="5" stroke-linejoin="round" stroke-dasharray="13 10"/>
<polyline points="450,1017 745,1017 745,1041 1260,1041" fill="none" stroke="#64748b" stroke-width="5" stroke-linejoin="round" stroke-dasharray="13 10"/>
<circle cx="450" cy="535" r="7" fill="#d73d4d"/>
<circle cx="1260" cy="520" r="7" fill="#d73d4d"/>
<circle cx="450" cy="615" r="7" fill="#334155"/>
<circle cx="1260" cy="590" r="7" fill="#334155"/>
<circle cx="1260" cy="671" r="7" fill="#2563eb"/>
<circle cx="450" cy="740" r="7" fill="#2563eb"/>
<circle cx="1260" cy="740" r="7" fill="#2563eb"/>
<circle cx="450" cy="901" r="7" fill="#d73d4d"/>
<circle cx="1260" cy="970" r="7" fill="#d73d4d"/>
<circle cx="450" cy="1017" r="7" fill="#64748b"/>
<circle cx="1260" cy="1041" r="7" fill="#64748b"/>
<circle cx="790" cy="615" r="7" fill="#2563eb"/>
<text x="86" y="513" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#d73d4d">DC12V</text>
<text x="86" y="550" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#64748b">人脸机保持常供电</text>
<text x="86" y="594" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#334155">GND-B（图内代号）</text>
<text x="86" y="632" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#64748b">对应 DC12V / PUSH 旁的 GND</text>
<text x="86" y="718" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#2563eb">PUSH</text>
<text x="86" y="756" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#64748b">开锁触发输入，定义须先确认</text>
<text x="86" y="879" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#d73d4d">NC</text>
<text x="86" y="918" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#64748b">仅在确认常闭 12V 锁输出后使用</text>
<text x="86" y="995" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#64748b">GND-A（图内代号）</text>
<text x="86" y="1034" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#64748b">对应 NO / NC 旁的 GND</text>
<text x="86" y="1100" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#64748b">NO / +CONTROL / −CONTROL</text>
<text x="86" y="1137" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#64748b">本候选方案不使用</text>
<text x="86" y="1176" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#9a3412">A/B 不证明两 GND 内部相通</text>
<text x="1284" y="500" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#d73d4d">POWER IN：+12V（电源红线）</text>
<text x="1284" y="570" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#334155">POWER IN：GND（电源黑线）</text>
<text x="1284" y="650" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#2563eb">LOCK COM：继电器公共端</text>
<text x="1284" y="720" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#2563eb">LOCK NO：开锁时闭合到 COM</text>
<text x="1284" y="778" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#64748b">LOCK NC：不接，单独绝缘</text>
<text x="1284" y="950" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#d73d4d">红 Red：+12VDC</text>
<text x="1284" y="1021" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#64748b">黑 Black：0V</text>
<text x="1284" y="1080" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#64748b">橙 Open / 绿 NO / 白 COM</text>
<text x="1284" y="1117" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#64748b">条件允许留空时：逐根绝缘、不互接</text>
<text x="1284" y="1156" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#9a3412">锁白 COM ≠ 人脸机 LOCK COM</text>
<text x="555" y="485" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#d73d4d">常供电：DC12V → 人脸机 POWER +12V</text>
<text x="560" y="570" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#334155">电源 GND → 人脸机 POWER GND</text>
<text x="800" y="677" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#2563eb">条件控制：COM → 参考 GND</text>
<text x="610" y="765" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#2563eb">条件控制：LOCK NO → PUSH</text>
<text x="560" y="849" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#d73d4d">条件锁供电：电源 NC → 锁红线</text>
<text x="530" y="1068" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#64748b">条件锁回路：配对 GND → 锁黑线</text>
<rect x="60" y="1250" width="1800" height="110" rx="16" fill="#eaf1fc" stroke="none" stroke-width="2"/>
<text x="86" y="1268" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">条件成立后的逻辑</text>
<text x="86" y="1311" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#17263e">人脸机 LOCK COM / NO 闭合 → PUSH 触发 → 电源 NC 断电 → 电锁释放</text>
<polyline points="88,1400 180,1400" fill="none" stroke="#d73d4d" stroke-width="5" stroke-linejoin="round"/>
<text x="200" y="1383" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#17263e">实线：标签可识别的供电路径</text>
<polyline points="920,1400 1012,1400" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-dasharray="13 10"/>
<text x="1032" y="1383" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#17263e">虚线：待核条件成立后才接通</text>
<text x="85" y="1450" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#9a3412">断电接线 · 门保持打开再测试 · 不涉及 220V 接线 · 通断档仅可断电使用</text>
<text x="85" y="1503" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#17263e">门禁机提示“开门”或 HTTP 200，不代表锁已释放；现场功能尚未验收。</text>
<text x="85" y="1555" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#64748b">文档日期：2026-11-26（Asia/Shanghai）｜按用户照片标签整理，非厂家确认图。</text>
</svg>
