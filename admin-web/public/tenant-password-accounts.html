<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>租客密码账号 · 管理工作台</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/tenant-password-accounts.js"></script>
  </head>
  <body>
    <div class="main-wrap">
      <header class="topbar">
        <div class="breadcrumb">管理控制台 <span>/ <b>租客密码账号</b></span></div>
        <div class="top-right"><a class="link" href="/">返回管理工作台</a></div>
      </header>
      <main class="workspace">
        <div class="page-head"><div><h1>租客密码账号</h1><p>由管理员开通、重置或停用小程序密码登录。</p></div></div>
        <div class="notice">
          请让租客在本人微信小程序中生成短期开通码，再交管理员开通。账号绑定由服务端核验，不能手工指定其他用户。<br />
          此处账号与管理后台账号独立。停用只关闭密码登录入口，不撤销微信／手机号登录或房产权限。密码仅本次提交，不显示历史密码。
        </div>
        <section id="account-login" class="panel" hidden>
          <div class="panel-head"><h2>需要系统管理员登录</h2></div>
          <p id="login-message">请先在管理工作台以系统管理员身份登录。</p>
          <p><a class="link" href="/">前往管理工作台</a></p>
        </section>
        <div id="account-content" hidden>
          <section class="panel">
            <div class="panel-head"><h2>已开通账号</h2><button id="reload-accounts" class="btn" type="button">刷新列表</button></div>
            <div class="table-wrap"><table><thead><tr><th>账号</th><th>密码入口状态</th><th>版本</th><th>更新时间</th></tr></thead><tbody id="account-rows"></tbody></table></div>
            <p id="accounts-empty" class="muted" hidden>暂未开通密码账号。</p>
          </section>
          <section class="panel">
            <div class="panel-head"><h2>开通账号</h2></div>
            <form id="create-account-form" autocomplete="off">
              <div class="form-grid">
                <label class="field">本人短期开通码<input id="enrollment-code" name="requestCode" maxlength="128" autocomplete="off" required /></label>
                <label class="field">登录账号<input id="create-username" name="username" minlength="4" maxlength="32" autocomplete="off" required /><small>4–32位字母、数字、点、下划线或连字符；首位需为字母或数字，字母不区分大小写。</small></label>
                <label class="field full">初始密码<input id="create-password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required /><small>12–128个字符，UTF-8不超过256字节；密码中的空格会保留。</small></label>
              </div>
              <div class="actions"><button class="btn primary" type="submit">开通密码账号</button></div>
            </form>
          </section>
          <section class="panel">
            <div class="panel-head"><h2>重置密码</h2></div>
            <form id="reset-password-form" autocomplete="off">
              <div class="form-grid">
                <label class="field">账号<select id="reset-account" name="accountId" required></select></label>
                <label class="field">新密码<input id="reset-password" name="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required /></label>
              </div>
              <p class="muted">重置不会变更账号的微信绑定或启停状态，请将新密码交给本人。</p>
              <div class="actions"><button class="btn primary" type="submit">重置所选账号密码</button></div>
            </form>
          </section>
          <section class="panel">
            <div class="panel-head"><h2>启停密码入口</h2></div>
            <form id="account-status-form">
              <div class="form-grid">
                <label class="field">账号<select id="status-account" name="accountId" required></select></label>
                <label class="field">密码入口<select id="password-status" name="status"><option value="disabled">停用密码登录</option><option value="active">启用密码登录</option></select></label>
              </div>
              <div class="actions"><button class="btn primary" type="submit">保存密码入口状态</button></div>
            </form>
          </section>
        </div>
        <p id="account-message" class="notice" role="status" aria-live="polite" hidden></p>
      </main>
    </div>
  </body>
</html>
